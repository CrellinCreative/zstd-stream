<div class="container">
  <h1>Zstd File Compressor</h1>

  @if (mode(); as m) {
  <span class="mode-badge" [class]="m">{{ m }}</span>
  }

  <div class="file-input">
    <div class="flex">
      <label class="upload-btn" [class.disabled]="isProcessing()">
        {{ isProcessing() ? 'Processing…' : 'Select file' }}
        <input type="file" hidden [disabled]="isProcessing()" (change)="onFileSelected($event)" />

      </label>
      <select class="selector" (change)="onLevelSelected($event)">
        @for(l of levels(); track l) {
        <option [value]="l" [selected]="l===selected()">
          {{l}}
        </option>
        }
      </select>
    </div>
    @if (fileName()) {
    <span class="file-name">{{ fileName() }}</span>
    }
  </div>

  @if (isProcessing()) {
  <div class="progress">
    <div class="progress-bar">
      <div class="progress-fill" [style.width.%]="progress()"></div>
    </div>
    <span>{{ progress() }}%</span>
  </div>
  }

  <div class="status">
    <span class="status-text">{{ status() }}</span>
    @if (error(); as e) {
    <span class="error">{{ e }}</span>
    }
  </div>

  <div class="instructions">
    <p><strong>Compress</strong> — select any file to produce a <code>.zst</code></p>
    <p><strong>Decompress</strong> — select a <code>.zst</code> file to restore it</p>
  </div>
</div>
